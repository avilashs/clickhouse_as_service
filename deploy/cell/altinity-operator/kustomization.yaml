# Altinity clickhouse-operator release-0.27.4 (Apache-2.0), unmodified upstream bundle + patches.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- upstream-0.27.4.yaml
patches:
- target: {kind: Deployment, name: clickhouse-operator}
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/containers/1/imagePullPolicy
      value: IfNotPresent
    - op: add
      path: /spec/template/spec/nodeSelector
      value: {basalt.io/pool: control}
# The upstream bundle ships a fixed, public password for the operator's ClickHouse user
# ("clickhouse_operator_password"). Drop that Secret; hack/cell-up.sh creates it once with a
# random password (production: cell provisioning).
- target: {kind: Secret, name: clickhouse-operator, namespace: kube-system}
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Secret
    metadata: {name: clickhouse-operator, namespace: kube-system}
- target: {kind: Deployment, name: clickhouse-operator}
  patch: |-
    - op: add
      path: /spec/template/spec/tolerations
      value: [{key: basalt.io/pool, operator: Equal, value: control, effect: NoSchedule}]
