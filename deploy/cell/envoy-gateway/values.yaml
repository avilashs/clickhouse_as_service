# Envoy Gateway v1.5.0 (Apache-2.0) helm values for a Basalt cell.
deployment:
  envoyGateway:
    imagePullPolicy: IfNotPresent
  pod:
    nodeSelector: {basalt.io/pool: control}
    tolerations: [{key: basalt.io/pool, operator: Equal, value: control, effect: NoSchedule}]
certgen:
  job:
    nodeSelector: {basalt.io/pool: control}
    tolerations: [{key: basalt.io/pool, operator: Equal, value: control, effect: NoSchedule}]
