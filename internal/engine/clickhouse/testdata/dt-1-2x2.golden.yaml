        interserver_http_port: _removed_
        interserver_https_port: 9010
        listen_host: 0.0.0.0
        max_concurrent_queries: 50
        max_server_memory_usage: 1825361100
        mysql_port: _removed_
        postgresql_port: _removed_
        remote_url_allow_hosts/host: basalt-no-egress.invalid
        tcp_port: _removed_
        tcp_port_secure: 9440
        user_scripts_path: /nonexistent/basalt-no-user-scripts/
      users:
        default/networks/ip:
        - 127.0.0.1
