- apiVersion: clickhouse-keeper.altinity.com/v1
  kind: ClickHouseKeeperInstallation
  metadata:
    labels:
      basalt.io/cluster: cded1234abcd
      basalt.io/component: keeper
    name: cded1234abcd
    namespace: ch-cded1234abcd
  spec:
    configuration:
      clusters:
      - insecure: "no"
        layout:
          replicasCount: 3
        name: keeper
        secure: "yes"
      files:
        basalt-openssl.xml: |
          <clickhouse>
            <openSSL>
              <server>
                <certificateFile>/etc/basalt/certs/server.crt</certificateFile>
                <privateKeyFile>/etc/basalt/certs/server.key</privateKeyFile>
                <caConfig>/etc/basalt/certs/ca.crt</caConfig>
                <!-- relaxed: request a client certificate and verify it against the cell CA when one is
                     presented (the provider user authenticates with one); clients without one are fine -->
                <verificationMode>relaxed</verificationMode>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
              </server>
              <client>
                <caConfig>/etc/basalt/certs/ca.crt</caConfig>
                <loadDefaultCAFile>false</loadDefaultCAFile>
                <verificationMode>strict</verificationMode>
                <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
              </client>
            </openSSL>
          </clickhouse>
      settings:
        keeper_server/four_letter_word_white_list: ruok,mntr,srvr,stat,conf,isro
        listen_host: 0.0.0.0
        logger/level: information
    defaults:
      templates:
        dataVolumeClaimTemplate: keeper-data
        podTemplate: keeper
    templates:
      podTemplates:
      - metadata:
          labels:
            basalt.io/cluster: cded1234abcd
            basalt.io/component: keeper
        name: keeper
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    clickhouse-keeper.altinity.com/chk: cded1234abcd
                topologyKey: kubernetes.io/hostname
          automountServiceAccountToken: false
          containers:
          - image: clickhouse/clickhouse-keeper:26.8.34.13
            imagePullPolicy: IfNotPresent
            name: clickhouse-keeper
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 100m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - mountPath: /etc/basalt/certs
              name: certs
              readOnly: true
          nodeSelector:
            basalt.io/pool: control
          securityContext:
            fsGroup: 101
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
            seccompProfile:
              type: RuntimeDefault
          tolerations:
          - effect: NoSchedule
            key: basalt.io/pool
            operator: Equal
            value: control
          topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                clickhouse-keeper.altinity.com/chk: cded1234abcd
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
          volumes:
          - name: certs
            secret:
              defaultMode: 288
              secretName: ch-certs
      volumeClaimTemplates:
      - name: keeper-data
        spec:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
