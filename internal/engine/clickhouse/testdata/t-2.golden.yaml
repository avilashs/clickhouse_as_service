bootstrap:
- CREATE ROLE IF NOT EXISTS customer_admin
- GRANT SELECT, INSERT, ALTER, CREATE DATABASE, CREATE TABLE, CREATE VIEW, CREATE
  DICTIONARY, CREATE FUNCTION, DROP DATABASE, DROP TABLE, DROP VIEW, DROP DICTIONARY,
  DROP FUNCTION, TRUNCATE, OPTIMIZE, SHOW, dictGet ON *.* TO customer_admin WITH GRANT
  OPTION
- REVOKE KILL QUERY ON *.* FROM customer_admin
- REVOKE SELECT ON system.zookeeper FROM customer_admin
- REVOKE SELECT ON system.zookeeper_connection FROM customer_admin
- REVOKE SELECT ON system.zookeeper_log FROM customer_admin
- REVOKE ALL ON _basalt.* FROM customer_admin
- REVOKE INSERT, ALTER, CREATE TABLE, CREATE VIEW, CREATE DICTIONARY, DROP TABLE,
  DROP VIEW, DROP DICTIONARY, TRUNCATE, OPTIMIZE ON system.* FROM customer_admin
- GRANT CLUSTER ON *.* TO customer_admin
- GRANT TABLE ENGINE ON ReplicatedMergeTree, TABLE ENGINE ON ReplicatedReplacingMergeTree,
  TABLE ENGINE ON ReplicatedAggregatingMergeTree, TABLE ENGINE ON ReplicatedSummingMergeTree,
  TABLE ENGINE ON ReplicatedCollapsingMergeTree, TABLE ENGINE ON ReplicatedVersionedCollapsingMergeTree,
  TABLE ENGINE ON Distributed, TABLE ENGINE ON MaterializedView, TABLE ENGINE ON View,
  TABLE ENGINE ON Null, TABLE ENGINE ON Memory, TABLE ENGINE ON Set, TABLE ENGINE
  ON Join, TABLE ENGINE ON Buffer, TABLE ENGINE ON Dictionary, TABLE ENGINE ON Merge
  TO customer_admin WITH GRANT OPTION
- GRANT CREATE USER, ALTER USER, DROP USER, CREATE ROLE, ALTER ROLE, DROP ROLE, CREATE
  ROW POLICY, ALTER ROW POLICY, DROP ROW POLICY, CREATE QUOTA, ALTER QUOTA, DROP QUOTA,
  SHOW ACCESS ON *.* TO customer_admin
- REVOKE CREATE ROW POLICY, ALTER ROW POLICY, DROP ROW POLICY ON system.* FROM customer_admin
- GRANT SYSTEM FLUSH LOGS, SYSTEM SYNC REPLICA, SYSTEM DROP QUERY CACHE, SYSTEM MERGES,
  SYSTEM TTL MERGES, SYSTEM MOVES, SYSTEM FETCHES, SYSTEM RESTART REPLICA ON *.* TO
  customer_admin
- CREATE USER IF NOT EXISTS admin IDENTIFIED WITH sha256_hash BY '{{secret:clusters/cabc123def45/admin|sha256}}'
- GRANT customer_admin TO admin
- ALTER USER admin DEFAULT ROLE customer_admin
- CREATE ROW POLICY OR REPLACE basalt_hide_provider ON system.query_log AS restrictive
  FOR SELECT USING user NOT IN ('provider_ops', 'default', 'clickhouse_operator')
  TO ALL EXCEPT provider_ops
- CREATE ROW POLICY OR REPLACE basalt_hide_provider ON system.query_thread_log AS
  restrictive FOR SELECT USING user NOT IN ('provider_ops', 'default', 'clickhouse_operator')
  TO ALL EXCEPT provider_ops
- CREATE ROW POLICY OR REPLACE basalt_hide_provider ON system.query_views_log AS restrictive
  FOR SELECT USING user NOT IN ('provider_ops', 'default', 'clickhouse_operator')
  TO ALL EXCEPT provider_ops
- CREATE ROW POLICY OR REPLACE basalt_hide_provider ON system.processes AS restrictive
  FOR SELECT USING user NOT IN ('provider_ops', 'default', 'clickhouse_operator')
  TO ALL EXCEPT provider_ops
- CREATE ROW POLICY OR REPLACE basalt_hide_provider ON system.session_log AS restrictive
  FOR SELECT USING user NOT IN ('provider_ops', 'default', 'clickhouse_operator')
  TO ALL EXCEPT provider_ops
